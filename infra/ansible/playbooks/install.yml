---
# Installation de Docker, Traefik, Prometheus et Grafana sur les serveurs
# Usage : ansible-playbook playbooks/install.yml

- name: Installer les outils de base (Docker)
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets de prérequis
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
        state: present

    - name: Créer le dossier pour les clés Docker
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Récupérer la clé GPG officielle de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt officiel Docker
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        signed_by: /etc/apt/keyrings/docker.asc
        architectures: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
        uris: ["https://download.docker.com/linux/ubuntu"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: ["stable"]
        state: present

    - name: Installer Docker Engine et le plugin Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
        state: present

    - name: Activer et démarrer Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Ajouter l'utilisateur au groupe docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true