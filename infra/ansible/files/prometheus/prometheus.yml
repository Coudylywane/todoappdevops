global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "todo-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          service: "todo-backend"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "system"