name: Deploy

# Déclenché sur un push vers develop (-> dev) ou main (-> prod)
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Détermine la cible selon la branche : main -> prod, sinon dev
      - name: Déterminer la cible (dev ou prod)
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "host=${{ secrets.PROD_HOST }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "host=${{ secrets.DEV_HOST }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Charger la clé SSH dans l'agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ajouter le serveur aux known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ steps.target.outputs.host }} >> ~/.ssh/known_hosts

      - name: Copier le backend vers le serveur ${{ steps.target.outputs.env }}
        run: |
          rsync -avzr --delete \
            --exclude=node_modules --exclude=dist --exclude=.env \
            --exclude=.git --exclude=*.log \
            backend/ ubuntu@${{ steps.target.outputs.host }}:/opt/todo/backend/

      - name: Copier le frontend vers le serveur ${{ steps.target.outputs.env }}
        run: |
          rsync -avzr --delete \
            --exclude=node_modules --exclude=dist --exclude=.env \
            --exclude=.git --exclude=*.log \
            frontend/ ubuntu@${{ steps.target.outputs.host }}:/opt/todo/frontend/

      - name: Reconstruire et redémarrer la stack ${{ steps.target.outputs.env }}
        run: |
          ssh ubuntu@${{ steps.target.outputs.host }} \
            'cd /opt/todo && docker compose -f docker-compose.app.yml up -d --build && docker image prune -f'
          echo "Déploiement terminé sur l'environnement : ${{ steps.target.outputs.env }}"