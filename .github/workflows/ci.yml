name: CI - Build & Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Installation des dépendances
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Build (${{ matrix.app }})
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run build
          else
            node --check src/server.js
            for f in src/routes/*.js src/db/*.js; do [ -f "$f" ] && node --check "$f"; done
          fi
        working-directory: ${{ matrix.app }}

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build image Docker backend
        run: docker build -t todo-backend:test ./backend

      - name: Build image Docker frontend
        run: docker build -t todo-frontend:test ./frontend